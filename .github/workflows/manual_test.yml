name: Kur Takip - Günlük

on:
  workflow_dispatch:

  schedule:
    # Her gün Türkiye saatiyle 09:17'de çalışır.
    # Saat başı yoğunluğunu azaltmak için :00 yerine :17 kullanıyoruz.
    - cron: "00 10 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: banka-kurlari-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium kur
        run: |
          python -m playwright install --with-deps chromium

      - name: Unit testleri çalıştır
        run: |
          python -m unittest discover -s tests -v

      - name: Kurları çek, geçmişe ekle ve Excel'i güncelle
        run: |
          python main.py

      - name: Excel'i Actions yedeği olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: banka-kurlari
          path: output/banka_kurlari.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Güncel geçmişi ve Excel'i repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/latest_rates.csv \
            data/rates_history.csv \
            output/banka_kurlari.xlsx

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni değişiklik yok."
          else
            git commit -m "Günlük kur verisi: $(TZ='Europe/Istanbul' date +'%d.%m.%Y %H:%M')"

            echo "Remote main kontrol ediliyor..."
            git fetch origin main

            echo "En güncel main üzerine rebase yapılıyor..."
            git rebase origin/main

            echo "Geçmiş ve tek kalıcı Excel repoya gönderiliyor..."
            git push origin HEAD:main
          fi

      - name: Excel'i e-posta ile gönder
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python send_report.py
